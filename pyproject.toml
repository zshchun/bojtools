[project]
name = "bojtools"
version = "0.7.4"
description = "Baekjoon Online Judge CLI tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.13.3",
    "lxml>=6.0.2",
    "patchright>=1.60.1",
    "pylatexenc>=2.10,<3",
    "tomli>=2.4.0",
    "tomli-w>=1.2.0",
]
license = {text = "MIT"}
authors = [
    {name = "Seunghwan Chun", email = "zshchun@gmail.com"},
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
source-exclude = [
    "*.png",
    "*.jpg",
    "*.gif",
]

[project.scripts]
boj = "bojtools.__main__:main"

[project.urls]
Repository = "https://github.com/zshchun/bojtools"
